<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>reverie — film &amp; photo, lampang</title>
<meta name="description" content="Reverie — film and photo by Chaianan Panadit (Vi) in Lampang, Thailand. School events, live sessions, music videos, portraits and content shoots.">
<meta name="author" content="Chaianan Panadit">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f1ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="reverie — film &amp; photo, lampang">
<meta property="og:description" content="Film and photo by Vi. School events, live sessions, music videos, portraits. Lampang, Thailand.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chaiananpanadit.github.io/Reverie-Portfolio/">
<meta property="og:image" content="https://chaiananpanadit.github.io/Reverie-Portfolio/assets/media/covers/og.jpg?v=7">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/plex-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=7">
<script>
  /* Apply a saved theme and language before first paint, so a visitor who
     chose dark (or Thai) doesn't see a flash of the other one on every load. */
  try {
    var _t = localStorage.getItem('reverie-theme');
    if (_t === 'light' || _t === 'dark') document.documentElement.setAttribute('data-theme', _t);
    var _l = localStorage.getItem('reverie-lang');
    if (_l === 'th' || (!_l && /^th\b/i.test(navigator.language || ''))) document.documentElement.setAttribute('lang', 'th');
  } catch (e) {}
</script>
</head>
<body>

<a class="skip-link" href="#main" id="skip-link">skip to content</a>

<header class="top" id="top">
  <div class="top-inner">
    <a class="brand" href="#/">
      <span class="wordmark" data-bind="name">reverie</span>
      <span class="tagline" data-bind="tagline">film · photo</span>
    </a>

    <nav class="top-nav" aria-label="Main">
      <ul id="nav-top"></ul>
    </nav>

    <div class="top-tools">
      <div class="lang" id="lang" role="group" aria-label="Language"></div>

      <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-label="Toggle theme">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <mask id="theme-cut">
            <rect x="-4" y="-4" width="32" height="32" fill="#fff"/>
            <circle class="theme-bite" cx="12" cy="12" r="8" fill="#000"/>
          </mask>
          <circle class="theme-orb" cx="12" cy="12" r="8" fill="currentColor" mask="url(#theme-cut)"/>
          <g class="theme-rays" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <line x1="12" y1="0.5" x2="12" y2="3"/>
            <line x1="12" y1="21"  x2="12" y2="23.5"/>
            <line x1="0.5" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12"  x2="23.5" y2="12"/>
            <line x1="4"  y1="4"   x2="5.8" y2="5.8"/>
            <line x1="18.2" y1="18.2" x2="20" y2="20"/>
            <line x1="4"  y1="20"  x2="5.8" y2="18.2"/>
            <line x1="18.2" y1="5.8" x2="20" y2="4"/>
          </g>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <div class="view" id="view"></div>
</main>

<footer class="foot" id="foot"></footer>

<!-- phone only: the five pages, always under the thumb -->
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<!-- full-screen photo viewer, opened by tapping any photo on a project page -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" hidden>
  <img class="viewer-img" id="viewer-img" alt="">
  <p class="viewer-count" id="viewer-count"></p>
  <button class="viewer-btn viewer-close" id="viewer-close" type="button">&#215;</button>
  <button class="viewer-btn viewer-prev" id="viewer-prev" type="button">&#8592;</button>
  <button class="viewer-btn viewer-next" id="viewer-next" type="button">&#8594;</button>
</div>

<script src="js/content.js?v=10"></script>
<script src="js/app.js?v=7"></script>
</body>
</html>
